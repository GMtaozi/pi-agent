<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>pi-agent · 工作流编排</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode:'class', theme:{ extend:{ fontFamily:{ sans:['Inter','system-ui','sans-serif'], mono:['JetBrains Mono','monospace'] }, colors:{ brand:'var(--brand)','brand-hover':'var(--brand-hover)',cyan:'var(--brand-cyan)', bgp:'var(--bg-primary)',bgs:'var(--bg-secondary)',bgt:'var(--bg-tertiary)',bgh:'var(--bg-hover)',bge:'var(--bg-elevated)',bgi:'var(--bg-input)',bgc:'var(--bg-canvas)', tp:'var(--text-primary)',ts:'var(--text-secondary)',tt:'var(--text-tertiary)', ok:'var(--success-color)',warn:'var(--warning-color)',err:'var(--error-color)',info:'var(--info-color)' }, borderColor:{ DEFAULT:'var(--border-color)',strong:'var(--border-strong)' } } } };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="design-system.css" />
  <script src="design-system.js"></script>
  <style>
    .canvas-bg { background-color: var(--bg-canvas); background-image: radial-gradient(var(--border-strong) 1px, transparent 1px); background-size: 22px 22px; }
    .wf-node { position:absolute; width:200px; border:1px solid var(--border-color); background:var(--bg-secondary); border-radius:var(--radius-md); box-shadow:var(--shadow-md); }
    .wf-node.selected { border-color:var(--brand); box-shadow:0 0 0 3px var(--accent-light); }
    .wf-node .wf-handle { position:absolute; width:12px;height:12px;border-radius:50%;background:var(--bg-tertiary);border:2px solid var(--text-tertiary); top:50%; transform:translateY(-50%); }
    .wf-node .wf-handle.in { left:-7px; } .wf-node .wf-handle.out { right:-7px; }
    .wf-edge { stroke:var(--brand); stroke-width:2; fill:none; }
  </style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand-row">
        <div class="brand-mark"><div class="brand-logo"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 4.6L18.5 9l-4.6 1.9L12 15l-1.9-4.1L5.5 9l4.6-1.4L12 3z"/><circle cx="18.5" cy="17" r="2.2"/><circle cx="5.5" cy="17" r="1.6"/></svg></div><span class="brand-text brand-name">pi<b>·</b>agent</span></div>
        <button class="nav-toggle" data-collapse-sidebar><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg></button>
      </div>
      <button class="nav-new-btn" onclick="piToast('新建工作流')"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg><span>新建工作流</span></button>
      <nav class="nav-scroll" data-nav-group>
        <div class="nav-section-label">工作区</div>
        <a class="nav-item" data-nav href="dashboard.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg><span>仪表盘</span></a>
        <a class="nav-item" data-nav href="agents.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8a3 3 0 100-6 3 3 0 000 6z"/><path d="M5 21a7 7 0 0114 0"/><circle cx="18.5" cy="7" r="2.2"/><path d="M20 13a4 4 0 010 8"/></svg><span>Agent 管理</span></a>
        <a class="nav-item" data-nav href="knowledge.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h11a3 3 0 013 3v13H7a3 3 0 01-3-3V4z"/><path d="M4 4a2 2 0 012-2h2v18"/><path d="M18 8h2a2 2 0 010 4h-2"/></svg><span>知识库</span></a>
        <a class="nav-item active" data-nav href="workflow.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="6" height="6" rx="1.5"/><rect x="15" y="15" width="6" height="6" rx="1.5"/><path d="M9 6h4a3 3 0 013 3v6"/></svg><span>工作流编排</span></a>
        <a class="nav-item" data-nav href="monitor.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l3 8 4-16 3 8h4"/></svg><span>监控面板</span></a>
        <a class="nav-item" data-nav href="notifications.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 01-3.4 0"/></svg><span>通知中心</span><span class="badge badge-brand nav-badge">3</span></a>
        <div class="nav-section-label">对话</div>
        <a class="nav-item" data-nav href="chat.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2v10z"/></svg><span>对话调试</span></a>
      </nav>
      <div class="sidebar-footer">
        <div class="conn-status"><span class="conn-dot"></span><span>已连接 · v2.3.1</span></div>
        <a class="settings-trigger nav-item" data-nav href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.6 1.6 0 00-2.7 1.1V21a2 2 0 11-4 0v-.1A1.6 1.6 0 005 19.4a1.6 1.6 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1A1.6 1.6 0 002.6 14H2.5a2 2 0 110-4h.1A1.6 1.6 0 004.6 8.5l-.1-.1a2 2 0 112.8-2.8l.1.1A1.6 1.6 0 0010 5.6V5.5a2 2 0 014 0v.1a1.6 1.6 0 002.7 1.1l.1-.1a2 2 0 112.8 2.8l-.1.1a1.6 1.6 0 001.1 2.7H21a2 2 0 110 4h-.1a1.6 1.6 0 00-1.5 1z"/></svg><span>设置</span></a>
      </div>
    </aside>
    <div class="scrim" id="scrim" data-close-sidebar></div>

    <div class="main">
      <header class="header">
        <button class="icon-btn mobile-menu-btn" data-open-sidebar><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
        <div style="min-width:0"><div style="font-weight:600;font-size:14px">售后自动处理流</div><div class="secondary" style="font-size:11px">v3 · 4 个节点</div></div>
        <div class="header-spacer"></div>
        <button class="btn btn-secondary btn-sm" onclick="piToast('已保存')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/><path d="M17 21v-8H7v8M7 3v5h8"/></svg>保存</button>
        <button class="btn btn-primary btn-sm" onclick="piToast('▶ 工作流运行中…')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3l14 9-14 9V3z"/></svg>运行</button>
        <button class="icon-btn" data-theme-toggle><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg></button>
        <button class="icon-btn" onclick="piToast('暂无新通知')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 01-3.4 0"/></svg><span class="dot"></span></button>
        <div class="avatar" title="林知遥">林</div>
      </header>

      <div class="flex" style="flex:1;min-height:0">
        <!-- Node palette -->
        <aside class="sidebar" style="width:210px;border-right:1px solid var(--border-color);border-left:none;background:var(--bg-secondary);overflow-y:auto">
          <div class="sidebar-section-label">节点</div>
          <div class="px-1 flex flex-col gap-2">
            <div class="flex items-center gap-2 p-2 rounded-lg card-hover" style="border:1px solid var(--border-color);background:var(--bg-canvas);cursor:grab" onclick="piToast('已添加：触发器')"><div class="agent-ico" style="width:30px;height:30px;font-size:13px;background:linear-gradient(135deg,#8b5cf6,#06b6d4)"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2L3 14h7l-1 8 10-12h-7l1-8z"/></svg></div><div style="font-size:12px">触发器</div></div>
            <div class="flex items-center gap-2 p-2 rounded-lg card-hover" style="border:1px solid var(--border-color);background:var(--bg-canvas);cursor:grab" onclick="piToast('已添加：大语言模型')"><div class="agent-ico" style="width:30px;height:30px;font-size:13px;background:linear-gradient(135deg,#06b6d4,#3b82f6)"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 8a3 3 0 100-6 3 3 0 000 6z"/><path d="M5 21a7 7 0 0114 0"/></svg></div><div style="font-size:12px">大语言模型</div></div>
            <div class="flex items-center gap-2 p-2 rounded-lg card-hover" style="border:1px solid var(--border-color);background:var(--bg-canvas);cursor:grab" onclick="piToast('已添加：知识检索')"><div class="agent-ico" style="width:30px;height:30px;font-size:13px;background:linear-gradient(135deg,#8b5cf6,#ec4899)"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/></svg></div><div style="font-size:12px">知识检索</div></div>
            <div class="flex items-center gap-2 p-2 rounded-lg card-hover" style="border:1px solid var(--border-color);background:var(--bg-canvas);cursor:grab" onclick="piToast('已添加：条件分支')"><div class="agent-ico" style="width:30px;height:30px;font-size:13px;background:linear-gradient(135deg,#f59e0b,#8b5cf6)"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3v12a3 3 0 003 3h9"/><path d="M6 21a3 3 0 01-3-3"/><path d="M18 6l3 3-3 3"/></svg></div><div style="font-size:12px">条件分支</div></div>
            <div class="flex items-center gap-2 p-2 rounded-lg card-hover" style="border:1px solid var(--border-color);background:var(--bg-canvas);cursor:grab" onclick="piToast('已添加：HTTP 请求')"><div class="agent-ico" style="width:30px;height:30px;font-size:13px;background:linear-gradient(135deg,#10b981,#06b6d4)"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 007 0l3-3a5 5 0 00-7-7l-1 1"/><path d="M14 11a5 5 0 00-7 0l-3 3a5 5 0 007 7l1-1"/></svg></div><div style="font-size:12px">HTTP 请求</div></div>
            <div class="flex items-center gap-2 p-2 rounded-lg card-hover" style="border:1px solid var(--border-color);background:var(--bg-canvas);cursor:grab" onclick="piToast('已添加：输出回复')"><div class="agent-ico" style="width:30px;height:30px;font-size:13px;background:linear-gradient(135deg,#64748b,#475569)"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2v10z"/></svg></div><div style="font-size:12px">输出回复</div></div>
          </div>
        </aside>

        <!-- Canvas -->
        <main class="flex-1 relative overflow-hidden canvas-bg" style="min-width:0">
          <div style="position:absolute;inset:0">
            <!-- edges -->
            <svg style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none" viewBox="0 0 1000 600" preserveAspectRatio="none">
              <path class="wf-edge" d="M250,110 C340,110 340,200 430,200"/>
              <path class="wf-edge" d="M450,260 C540,260 540,200 630,200"/>
              <path class="wf-edge" d="M250,300 C340,300 340,400 430,400"/>
              <path class="wf-edge" d="M450,460 C540,460 540,400 630,400"/>
              <path class="wf-edge" d="M650,260 C720,260 720,400 790,400"/>
            </svg>
            <!-- nodes -->
            <div class="wf-node selected" style="left:50px;top:90px" onclick="selectNode(this)">
              <span class="wf-handle out"></span>
              <div class="flex items-center gap-2 p-3"><div class="agent-ico" style="width:28px;height:28px;font-size:12px;background:linear-gradient(135deg,#8b5cf6,#06b6d4)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2L3 14h7l-1 8 10-12h-7l1-8z"/></svg></div><div><div style="font-weight:600;font-size:13px">触发器</div><div class="secondary" style="font-size:11px">Webhook 消息</div></div></div>
            </div>
            <div class="wf-node" style="left:430px;top:180px" onclick="selectNode(this)">
              <span class="wf-handle in"></span><span class="wf-handle out"></span>
              <div class="flex items-center gap-2 p-3"><div class="agent-ico" style="width:28px;height:28px;font-size:12px;background:linear-gradient(135deg,#06b6d4,#3b82f6)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 8a3 3 0 100-6 3 3 0 000 6z"/><path d="M5 21a7 7 0 0114 0"/></svg></div><div><div style="font-weight:600;font-size:13px">大语言模型</div><div class="secondary" style="font-size:11px">GPT-4o · 意图识别</div></div></div>
            </div>
            <div class="wf-node" style="left:430px;top:380px" onclick="selectNode(this)">
              <span class="wf-handle in"></span><span class="wf-handle out"></span>
              <div class="flex items-center gap-2 p-3"><div class="agent-ico" style="width:28px;height:28px;font-size:12px;background:linear-gradient(135deg,#8b5cf6,#ec4899)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/></svg></div><div><div style="font-weight:600;font-size:13px">知识检索</div><div class="secondary" style="font-size:11px">售后知识库 · top3</div></div></div>
            </div>
            <div class="wf-node" style="left:790px;top:380px" onclick="selectNode(this)">
              <span class="wf-handle in"></span>
              <div class="flex items-center gap-2 p-3"><div class="agent-ico" style="width:28px;height:28px;font-size:12px;background:linear-gradient(135deg,#64748b,#475569)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2v10z"/></svg></div><div><div style="font-weight:600;font-size:13px">输出回复</div><div class="secondary" style="font-size:11px">流式返回用户</div></div></div>
            </div>
          </div>

          <!-- zoom toolbar -->
          <div class="flex items-center gap-1 p-1 rounded-lg" style="position:absolute;bottom:16px;left:16px;background:var(--bg-elevated);border:1px solid var(--border-color);box-shadow:var(--shadow-md)">
            <button class="icon-btn btn-sm" style="width:30px;height:30px" onclick="piToast('缩小')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/></svg></button>
            <span style="font-size:12px;width:42px;text-align:center" class="secondary">100%</span>
            <button class="icon-btn btn-sm" style="width:30px;height:30px" onclick="piToast('放大')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg></button>
            <button class="icon-btn btn-sm" style="width:30px;height:30px" onclick="piToast('适配视图')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9V3h6M21 9V3h-6M3 15v6h6M21 15v6h-6"/></svg></button>
          </div>
        </main>

        <!-- Property panel -->
        <aside class="sidebar" style="width:300px;border-left:1px solid var(--border-color);border-right:none;background:var(--bg-secondary);overflow-y:auto">
          <div class="card-head" style="padding:16px 12px 8px"><div class="card-title" style="font-size:14px">节点配置</div><span class="badge badge-brand">触发器</span></div>
          <div class="px-3 flex flex-col gap-3" style="font-size:13px">
            <div class="field" style="margin:0"><label class="field-label">节点名称</label><input class="input" value="Webhook 消息触发" /></div>
            <div class="field" style="margin:0"><label class="field-label">触发类型</label><select class="select"><option>Webhook</option><option>定时 (Cron)</option><option>手动</option></select></div>
            <div class="field" style="margin:0"><label class="field-label">输入变量</label><div class="mono" style="font-size:11px;color:var(--text-secondary);background:var(--bg-input);padding:8px;border-radius:8px">{ "message": "string", "userId": "string" }</div></div>
            <div class="divider"></div>
            <div class="flex items-center justify-between" style="padding:10px;border:1px solid var(--border-color);border-radius:var(--radius-md)"><span style="font-size:13px">启用节点</span><span class="switch"><input type="checkbox" checked><span class="slider"></span></span></div>
            <button class="btn btn-danger btn-sm w-full" onclick="piToast('已删除节点')">删除节点</button>
          </div>
        </aside>
      </div>
    </div>
  </div>
  <script>
    function selectNode(el){ document.querySelectorAll('.wf-node').forEach(function(n){n.classList.remove('selected')}); el.classList.add('selected'); var name=el.querySelector('div>div:last-child>div:first-child')?el.querySelector('.agent-ico').nextElementSibling.firstElementChild.textContent:''; piToast('已选中节点'); }
  </script>
</body>
</html>
